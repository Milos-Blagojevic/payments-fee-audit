name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: make install
      - run: make all
      - name: Committed examples and README match the build
        run: |
          git status --porcelain reports/examples README.md docs/img
          test -z "$(git status --porcelain reports/examples README.md docs/img)"
          git diff --exit-code reports/examples README.md docs/img
      - run: make site
      - run: make test
