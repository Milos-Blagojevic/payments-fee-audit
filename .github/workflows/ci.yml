name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    # Runs on main wait for each other, so an older build never overwrites a newer one on Puter; other runs never wait.
    concurrency:
      group: ${{ github.ref == 'refs/heads/main' && 'ci-main' || format('ci-{0}', github.run_id) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      # site/package-lock.json is written by npm 11; npm 10 (bundled with Node 22) reads it as out of sync.
      - run: npm install -g npm@11.6.2
      - run: make install
      - run: make all
      # The data of the site's extraction page; not part of `make all`, but generated and checked the same way.
      - run: make extraction-export
      - name: Committed examples, README, walkthrough and extraction page data match the build
        run: |
          paths=(reports/examples README.md docs/walkthrough.md docs/img site/static/extract/extraction.json)
          git status --porcelain "${paths[@]}"
          test -z "$(git status --porcelain "${paths[@]}")"
          git diff --exit-code "${paths[@]}"
      # The extraction page's JavaScript against the recorded extractions (offline).
      - run: node --test tests/js/*.test.mjs
      - run: make site
      - run: make test
      # Publish site/build on Puter (README, "Report site"): pushes to main of this repository only, never pull
      # requests or forks, and only once the owner has set the PUTER_TOKEN secret and the PUTER_SUBDOMAIN variable.
      - name: Check the Puter deploy settings
        id: puter
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !github.event.repository.fork
        env:
          PUTER_TOKEN: ${{ secrets.PUTER_TOKEN }}
          PUTER_SUBDOMAIN: ${{ vars.PUTER_SUBDOMAIN }}
        run: |
          if [ -z "$PUTER_TOKEN" ] || [ -z "$PUTER_SUBDOMAIN" ]; then
            echo "::notice title=Puter deploy skipped::the PUTER_TOKEN secret or the PUTER_SUBDOMAIN variable is not set"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          elif ! printf '%s' "$PUTER_SUBDOMAIN" | grep -Eq '^[a-z0-9]([a-z0-9-]*[a-z0-9])?$'; then
            echo "::error title=Puter deploy::PUTER_SUBDOMAIN must be the bare label, e.g. fernway-fee-audit for fernway-fee-audit.puter.site"
            exit 1
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi
      # Pinned to the commit of tag v1.0.6; the action receives the Puter token. It uploads every file of the build
      # (overwriting) and points the subdomain at puter_path; it never deletes files there.
      - name: Deploy site/build to Puter
        if: steps.puter.outputs.deploy == 'true'
        uses: HeyPuter/puter-subdomain-deploy-action@88492ccf86048912f8be726a57756e5c3e4ef250 # v1.0.6
        with:
          subdomain: ${{ vars.PUTER_SUBDOMAIN }}
          puter_path: ~/Sites/${{ vars.PUTER_SUBDOMAIN }}/site
          source_path: site/build
          puter_token: ${{ secrets.PUTER_TOKEN }}
