name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      # site/package-lock.json is written by npm 11; npm 10 (bundled with Node 22) reads it as out of sync.
      - run: npm install -g npm@11.6.2
      - run: make install
      - run: make all
      # The data of the site's extraction page; not part of `make all`, but generated and checked the same way.
      - run: make extraction-export
      - name: Committed examples, README, walkthrough and extraction page data match the build
        run: |
          paths=(reports/examples README.md docs/walkthrough.md docs/img site/static/extract/extraction.json)
          git status --porcelain "${paths[@]}"
          test -z "$(git status --porcelain "${paths[@]}")"
          git diff --exit-code "${paths[@]}"
      # The extraction page's JavaScript against the recorded extractions (offline).
      - run: node --test tests/js/*.test.mjs
      - run: make site
      - run: make test
