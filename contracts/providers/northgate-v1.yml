# Northgate Acquiring: card acquiring on interchange++ pricing. Illustrative terms.
contract_id: NG-2025-01
party: provider
counterparty: northgate
name: Northgate Acquiring
version: 1
effective_from: 2025-07-01        # version 2 starts 2026-04-01
currency: EUR
timezone: Europe/Berlin           # month boundaries for tiers and the minimum
rounding: {mode: half_up, level: transaction}
dispute_window_days: 60
terms:
  - clause: "3.1"
    kind: pass_through
    title: Interchange and scheme fees at cost
    components: [interchange, scheme_fee]
    reference: interchange_table_v1
  - clause: "4.2"
    kind: markup_bps_tiered
    title: Acquirer markup by monthly processed volume
    component: markup
    basis: monthly_processed_volume
    tiering: retroactive
    tiers:
      - {up_to_minor: 250000000, bps: 45}
      - {up_to_minor: 800000000, bps: 35}
      - {up_to_minor: null, bps: 28}
  - clause: "4.3"
    kind: per_transaction_fixed
    title: Fixed fee per successful payment
    component: fixed_fee
    amount_minor: 4
  - clause: "5.1"
    kind: refund
    title: Refund fee and credit of the original markup
    fee_minor: 10
    credit_original_markup: true
  - clause: "6.1"
    kind: chargeback_fee
    title: Chargeback handling fee
    amount_minor: 1500
  - clause: "7.4"
    kind: monthly_minimum
    title: Monthly minimum markup
    applies_to: markup
    amount_minor: 250000
