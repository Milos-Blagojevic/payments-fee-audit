version: 2

models:
  - name: fct_findings
    description: >
      The single findings table. Rule findings (`method = 'rule'`): every compared charge whose billed
      amount differs from the contract by at least one minor unit, classified by the rule semantics of data contract
      section 5. The retroactive-tier pattern is one finding per provider × month; every other rule finding is one
      line or event × component. Month-level checks of a month the ledger does not cover yet, and lines after the
      ledger watermark, are pending and never findings. Anomaly findings (`method = 'anomaly'`): the
      fct_anomalies rows that neither a rule finding nor the contract explains (A44).
    columns:
      - name: finding_id
        description: Stable hash of the finding's inputs (method, party, provider, type, month, event, component, line ids).
        data_tests: [unique, not_null]
      - name: party
        description: "`provider` (client findings are in `fct_client_billing_findings`)."
        data_tests:
          - accepted_values:
              arguments:
                values: [provider]
      - name: counterparty
        description: The provider (or client) the finding is against.
        data_tests: [not_null]
      - name: finding_type
        description: >
          Finding type of data contract section 5, `rounding` or `fee_mismatch` (anything no rule explains) for rule
          findings; `new_component` or `rate_shift` for anomaly findings.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - stale_rate
                  - retroactive_tier_not_applied
                  - pass_through_above_reference
                  - refund_credit_missing
                  - minimum_not_due
                  - duplicate_charge
                  - wrong_card_segment
                  - fee_on_failed_attempt
                  - chargeback_fee_mismatch
                  - volume_discount_not_applied
                  - fx_spread_above_cap
                  - fx_rate_wrong_hour
                  - payout_fee_cap_not_applied
                  - unknown_charge
                  - refund_fee_missing
                  - rounding
                  - fee_mismatch
                  - new_component
                  - rate_shift
      - name: month
        description: First day of the event's month in the contract's time zone; for provider × month findings the provider month; for anomaly findings the UTC month of the day.
        data_tests: [not_null]
      - name: event_id
        description: Ledger event id; null for provider × month findings and for charges with no ledger event.
      - name: line_ids
        description: Provider line ids involved (empty when nothing was billed, for example a missing markup credit).
        data_tests: [not_null]
      - name: component
        description: "{{ doc('component') }}"
      - name: contract_id
        description: "{{ doc('contract_id') }} of the term breached."
        data_tests: [not_null]
      - name: contract_version
        description: "{{ doc('contract_version') }}"
        data_tests: [not_null]
      - name: clause
        description: "{{ doc('clause') }} Null for an anomaly on a component no clause names."
        data_tests:
          - not_null:
              config:
                where: "method = 'rule'"
      - name: expected_minor
        description: What the contract allows, minor units; for an anomaly finding, what the baseline rate would bill (0 for a new component).
        data_tests: [not_null]
      - name: billed_minor
        description: What was billed, minor units.
        data_tests: [not_null]
      - name: difference_minor
        description: billed − expected; positive = overcharge, negative = undercharge. Never below one minor unit in absolute value.
        data_tests: [not_null]
      - name: currency
        description: "{{ doc('currency') }}"
      - name: direction
        description: "`over` or `under`."
      - name: formula
        description: The expected calculation with real numbers and the clauses used.
        data_tests: [not_null]
      - name: evidence
        description: Source files and rows of every input (provider lines, ledger event) and the contract file and clause.
        data_tests: [not_null]
      - name: statement_month
        description: Statement month of the invoice the finding is disputed against.
      - name: invoice_id
        description: Provider invoice the finding belongs to.
        data_tests: [not_null]
      - name: invoice_date
        description: Invoice date.
      - name: dispute_deadline
        description: Invoice date + the contract's `dispute_window_days`.
      - name: days_left
        description: Days from the `as_of_date` var to the dispute deadline (negative = past, A22).
      - name: method
        description: "`rule` (section 5 rules) or `anomaly` (fct_anomalies)."
        data_tests:
          - accepted_values:
              arguments:
                values: [rule, anomaly]

  - name: fct_anomalies
    description: >
      Billing patterns no rule describes. `rate_shift`: a day whose effective rate of a provider ×
      fee component × card segment is beyond the robust z-score threshold against its trailing median
      (int_daily_component_rates, A10, A42). `new_component`: the first day a provider bills a fee component that no
      version of its contract names, after `anomaly_window_days` days of its history (A43). Each row states the
      baseline, the observed value and the threshold, and whether the day's money is already explained by rule
      findings or by the contract; only unexplained rows become findings (`is_finding`, A44).
    columns:
      - name: anomaly_id
        description: "`<anomaly_type>:<provider>:<component>:<card_segment>:<YYYY-MM-DD>`."
        data_tests: [unique, not_null]
      - name: anomaly_type
        description: "`rate_shift` or `new_component`."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [rate_shift, new_component]
      - name: provider
        description: "{{ doc('provider') }}"
        data_tests: [not_null]
      - name: component
        description: "{{ doc('component') }}"
        data_tests: [not_null]
      - name: card_segment
        description: "{{ doc('card_segment') }} `all` for `new_component`."
        data_tests: [not_null]
      - name: day
        description: UTC day of the events.
        data_tests: [not_null]
      - name: month
        description: First day of the UTC month of `day`.
      - name: observed_rate_bps
        description: The day's billed amount in basis points of the day's processed volume (the segment's for `rate_shift`, the provider's for `new_component`; null for a payout provider).
      - name: baseline_rate_bps
        description: Median rate of the trailing window (0 for `new_component`).
      - name: baseline_days
        description: Days in the trailing window (`rate_shift`) or days of the provider's history before the first appearance (`new_component`).
      - name: mad_bps
        description: Median absolute deviation of the window's rates.
      - name: mean_absolute_deviation_bps
        description: Mean absolute deviation, the fallback scale when the MAD is 0 (A42).
      - name: scoring_method
        description: "`mad`, `mean_absolute_deviation`, `constant_baseline` or `first_appearance`."
        data_tests:
          - accepted_values:
              arguments:
                values: [mad, mean_absolute_deviation, constant_baseline, first_appearance]
      - name: robust_z
        description: Robust z-score (null for `constant_baseline` and `first_appearance`).
      - name: z_threshold
        description: The `anomaly_z_threshold` var (null for `new_component`, flagged on any amount).
      - name: volume_minor
        description: Processed volume the rate relates to (M01 by UTC day), minor units.
      - name: billed_minor
        description: Billed amount of the component that day, minor units.
      - name: baseline_minor
        description: What the baseline rate would bill on the day's volume, minor units (0 for `new_component`).
      - name: line_count
        description: Provider lines billed that day.
      - name: rule_finding_charges
        description: Charges of the day that a rule classifies.
      - name: rule_difference_minor
        description: billed − expected over those charges.
      - name: unexplained_minor
        description: billed − expected over the other charges (money neither a rule nor the contract accounts for).
      - name: unexplained_line_ids
        description: Lines behind `unexplained_minor` (the anomaly finding's `line_ids`).
      - name: unexplained_source_files
        description: Statement files of those lines.
      - name: unexplained_statement_month
        description: Earliest statement month of those lines (the invoice an anomaly finding belongs to).
      - name: component_has_term
        description: Whether some version of the provider's contract names the component (A41).
      - name: explained_by
        description: "`rule_findings` (the shift is the money of rule findings on the same charges), `contract` (every charge equals its expected amount, as on a new tier or contract version) or null (unexplained)."
        data_tests:
          - accepted_values:
              arguments:
                values: [rule_findings, contract]
      - name: is_finding
        description: True when unexplained; the row is then an anomaly finding in fct_findings.
        data_tests: [not_null]
      - name: explanation
        description: Baseline, observed value, threshold and explanation in plain words.
        data_tests: [not_null]

  - name: fct_invoice_reconciliation
    description: >
      One row per provider × statement month: the invoice total against the sum of the statement's distinct
      invoiced lines (any difference reported in `invoice_difference_minor`), the expected total for the same
      charges, and the findings on that invoice.
    columns:
      - name: invoice_reconciliation_id
        description: "`<provider>:<YYYY-MM>`."
        data_tests: [unique, not_null]
      - name: provider
        description: "{{ doc('provider') }}"
        data_tests: [not_null]
      - name: statement_month
        description: First day of the statement month.
        data_tests: [not_null]
      - name: invoice_id
        description: Provider invoice number; null when lines have no invoice.
      - name: invoice_date
        description: Invoice date.
      - name: currency
        description: "{{ doc('currency') }}"
      - name: invoice_total_minor
        description: Invoice total, minor units; null when lines have no invoice.
      - name: lines_total_minor
        description: Sum of the statement month's distinct invoiced lines (Kestrel FX debits excluded), minor units.
      - name: line_count
        description: Number of distinct invoiced lines in the statement month.
      - name: invoice_difference_minor
        description: Invoice total − sum of lines; 0 when the invoice adds up.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0]
              config:
                severity: warn
      - name: expected_total_minor
        description: Expected invoiced charges of the events and months this statement billed (pending lines excluded).
      - name: pending_billed_minor
        description: Billed amount that cannot be checked yet (lines after the ledger watermark, months not covered).
      - name: billed_minus_expected_minor
        description: Sum of lines − pending − expected.
      - name: findings
        description: Number of non-rounding rule findings on the invoice (Kestrel FX findings concern debits outside the invoice total).
      - name: findings_total_minor
        description: Sum of their differences, minor units.
      - name: rounding_total_minor
        description: Sum of `rounding` differences, minor units.
      - name: source_file
        description: "{{ doc('source_file') }} (the invoice file)."
      - name: source_row
        description: "{{ doc('source_row') }}"

  - name: fct_provider_costs
    description: >
      Billed and expected provider fees per provider × UTC month × fee component × card segment, with the
      processed volume and effective rate (M02, M03, M04). FX conversion debits are not fees; their spread cost is
      in `fct_fx_conversions`.
    columns:
      - name: provider_cost_id
        description: "`<provider>:<YYYY-MM>:<component>:<card_segment>`."
        data_tests: [unique, not_null]
      - name: provider
        description: "{{ doc('provider') }}"
      - name: month
        description: First day of the UTC month of the event (monthly lines by the month they are for).
      - name: component
        description: "{{ doc('component') }}"
      - name: card_segment
        description: "`eea_consumer`, `other`, `not_applicable` (payouts and monthly lines) or `unknown` (lines with no ledger event yet or at all)."
        data_tests:
          - accepted_values:
              arguments:
                values: [eea_consumer, other, not_applicable, unknown]
      - name: lines
        description: Number of provider lines.
      - name: billed_minor
        description: M02 provider fees, billed, net of credits, minor units.
      - name: pending_billed_minor
        description: Part of `billed_minor` that cannot be checked yet.
      - name: expected_minor
        description: Expected fees of the checked charges, minor units.
      - name: difference_minor
        description: Billed − expected over the checked charges.
      - name: volume_minor
        description: M01 processed volume of the provider × month × card segment (the provider's whole volume for rows without a card segment).
      - name: effective_rate_bps
        description: M03 billed ÷ volume in basis points (M04 on `markup` rows).

  - name: fct_fx_conversions
    description: "One row per non-EUR payout Kestrel converted: mid against applied rate, the realised spread, its cost and the part above the cap (M08)."
    columns:
      - name: payout_id
        description: Ledger payout id.
        data_tests: [unique, not_null]
      - name: line_id
        description: Kestrel statement line.
        data_tests: [not_null]
      - name: client_id
        description: "{{ doc('client_id') }}"
      - name: executed_at_utc
        description: Execution time, UTC.
      - name: month
        description: UTC month of execution.
      - name: currency
        description: Payout currency.
      - name: rail
        description: Payout rail.
      - name: amount_minor
        description: Payout amount, minor units of the payout currency.
      - name: mid_rate
        description: Mid at the hour containing the execution time, payout-currency units per 1 EUR.
      - name: applied_rate
        description: Rate Kestrel applied.
      - name: rate_timestamp_utc
        description: Hour of the rate Kestrel used.
      - name: rate_hour_matches
        description: Whether that hour is the execution hour (clause 4.1).
      - name: spread_bps
        description: (mid − applied) ÷ mid in basis points, the direction that costs Fernway.
      - name: cap_bps
        description: Contractual spread cap for the currency.
      - name: eur_at_mid_minor
        description: EUR equivalent at mid, minor units.
      - name: eur_debited_minor
        description: EUR debited, minor units.
      - name: spread_cost_minor
        description: M08 FX spread cost, EUR debited − EUR at mid, minor units.
      - name: cap_allowance_minor
        description: Largest EUR debit the cap allows, minor units.
      - name: over_cap_cost_minor
        description: EUR debited above the allowance, minor units.
      - name: cost_currency
        description: Currency of the cost columns (EUR).
      - name: contract_id
        description: "{{ doc('contract_id') }}"
      - name: contract_version
        description: "{{ doc('contract_version') }}"
      - name: clause
        description: FX cap clause.
      - name: comparison_status
        description: "`compared` or `pending`."
      - name: finding_type
        description: "`fx_spread_above_cap`, `fx_rate_wrong_hour` or null."

  - name: fct_provider_comparison
    description: >
      Per card segment × UTC month × actual provider: what the volume cost under its own card contract (and what
      was billed) against what it would have cost under the other card provider's contract (A23).
    columns:
      - name: provider_comparison_id
        description: "`<card_segment>:<YYYY-MM>:<actual_provider>:<alternative_provider>`."
        data_tests: [unique, not_null]
      - name: card_segment
        description: "{{ doc('card_segment') }}"
      - name: month
        description: First day of the UTC month of the payments.
      - name: actual_provider
        description: Provider that processed the payments.
      - name: alternative_provider
        description: The other card provider.
      - name: payments
        description: Number of succeeded payments.
      - name: volume_minor
        description: M01 processed volume, minor units.
      - name: actual_billed_minor
        description: Payment-level fees billed for these payments, minor units.
      - name: actual_expected_minor
        description: Payment-level fees under the actual provider's contract, minor units.
      - name: alternative_expected_minor
        description: Payment-level fees under the alternative provider's contract, minor units.
      - name: saving_minor
        description: actual − alternative; positive means the alternative would have been cheaper.
      - name: actual_rate_bps
        description: Actual expected fees ÷ volume, basis points.
      - name: alternative_rate_bps
        description: Alternative fees ÷ volume, basis points.

  - name: fct_dispute_queue
    description: >
      One row per provider invoice with rule findings: overcharges to dispute (M05), what can still be recovered
      before the deadline (M07) and undercharges reported but not disputed (M06). `rounding` findings are excluded.
    columns:
      - name: dispute_queue_id
        description: The invoice id, or `<provider>:<month>` for a statement month with findings but no invoice yet.
        data_tests: [unique, not_null]
      - name: provider
        description: "{{ doc('provider') }}"
      - name: invoice_id
        description: Provider invoice.
      - name: statement_month
        description: Statement month of the invoice.
      - name: invoice_date
        description: Invoice date.
      - name: earliest_deadline
        description: Earliest dispute deadline of the invoice's findings.
      - name: days_left
        description: Days from the `as_of_date` var to the earliest deadline.
      - name: status
        description: "`open` (deadline not passed) or `expired`."
        data_tests:
          - accepted_values:
              arguments:
                values: [open, expired]
      - name: overcharge_findings
        description: Number of findings with a positive difference.
      - name: overcharge_minor
        description: M05 overcharge, minor units.
      - name: open_findings
        description: Overcharge findings whose deadline has not passed.
      - name: recoverable_minor
        description: M07 recoverable, minor units.
      - name: undercharge_findings
        description: Number of findings with a negative difference.
      - name: undercharge_minor
        description: M06 undercharge (negative), minor units.
      - name: finding_types
        description: Finding types on the invoice.
      - name: currency
        description: "{{ doc('currency') }}"

  - name: dim_contract_terms
    description: One row per contract version × clause (providers and clients) with a readable statement of the term.
    columns:
      - name: contract_term_id
        description: "`<contract_id> v<version> §<clause>`."
        data_tests: [unique, not_null]
      - name: contract_version_id
        description: "`<contract_id> v<version>`."
      - name: contract_id
        description: "{{ doc('contract_id') }}"
      - name: contract_version
        description: "{{ doc('contract_version') }}"
      - name: party
        description: "`provider` or `client`."
      - name: counterparty
        description: Provider id or client id.
      - name: contract_name
        description: Counterparty name as written in the contract.
      - name: clause
        description: "{{ doc('clause') }}"
      - name: kind
        description: Term kind.
      - name: title
        description: Short title of the clause.
      - name: clause_text
        description: The term in one readable sentence, with its numbers.
        data_tests: [not_null]
      - name: components
        description: Fee components the term produces.
      - name: effective_from
        description: First day the version applies.
      - name: effective_to
        description: Last day the version applies (inclusive); null for the latest version.
      - name: currency
        description: Contract currency.
      - name: timezone
        description: Time zone of the contract's dates and months.
      - name: rounding_mode
        description: "`half_up` or `half_even`."
      - name: rounding_level
        description: "`transaction` or `invoice_line`."
      - name: dispute_window_days
        description: Dispute window in days.
      - name: parameters
        description: All parameters of the term as JSON.
      - name: source_file
        description: The contract YAML file.

  - name: fct_client_billing_findings
    description: >
      Client billing findings: every client invoice line (client × month × component) whose billed
      amount differs from the pricing agreement by at least one minor unit. Same columns as `fct_findings` with
      party `client`; `component` is the invoice line component. Negative differences are revenue leakage that
      Fernway corrects on its own invoices; there is no provider dispute (A31). Every month is checked, the last one
      included, because the invoices are built from the same ledger export (A30).
    columns:
      - name: finding_id
        description: Stable hash of the finding's inputs (method, party, client, type, month, component, line ids).
        data_tests: [unique, not_null]
      - name: party
        description: "`client`."
        data_tests:
          - accepted_values:
              arguments:
                values: [client]
      - name: counterparty
        description: "{{ doc('client_id') }}"
        data_tests: [not_null]
      - name: finding_type
        description: >
          `rail_not_billed` (L01), `promo_after_end_date` (L02), `fx_markup_not_billed` (L03),
          `volume_discount_too_high` (L04), `rounding` or `fee_mismatch` (anything no rule explains).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [rail_not_billed, promo_after_end_date, fx_markup_not_billed, volume_discount_too_high, rounding, fee_mismatch]
      - name: month
        description: First day of the UTC invoice month.
        data_tests: [not_null]
      - name: event_id
        description: Always null (client findings are client × month × component).
      - name: line_ids
        description: Client invoice line ids (`<invoice_id>:<line_no>`); empty when the line is missing.
        data_tests: [not_null]
      - name: component
        description: "{{ doc('client_component') }}"
        data_tests: [not_null]
      - name: contract_id
        description: "{{ doc('contract_id') }} of the agreement (`FW-<client_id>`)."
        data_tests: [not_null]
      - name: contract_version
        description: "{{ doc('contract_version') }}"
        data_tests: [not_null]
      - name: clause
        description: "{{ doc('clause') }}"
        data_tests: [not_null]
      - name: expected_minor
        description: What the agreement says Fernway should bill, minor units.
        data_tests: [not_null]
      - name: billed_minor
        description: What the invoice billed, minor units.
        data_tests: [not_null]
      - name: difference_minor
        description: billed − expected; negative = revenue leakage. Never below one minor unit in absolute value.
        data_tests: [not_null]
      - name: currency
        description: "{{ doc('currency') }}"
      - name: direction
        description: "`under` (billed too little) or `over`."
      - name: formula
        description: The expected calculation with real numbers and the clause used.
        data_tests: [not_null]
      - name: evidence
        description: The invoice lines (file and rows) or their absence, the ledger events, and the agreement file and clause.
        data_tests: [not_null]
      - name: statement_month
        description: The invoice month.
      - name: invoice_id
        description: Fernway's client invoice the finding corrects.
        data_tests: [not_null]
      - name: invoice_date
        description: Invoice date.
      - name: dispute_deadline
        description: Invoice date + the agreement's `dispute_window_days`, the period in which the invoice is open to query and Fernway issues a correction (A31).
      - name: days_left
        description: Days from the `as_of_date` var to that date (negative = past, A22).
      - name: method
        description: "`rule`."
        data_tests:
          - accepted_values:
              arguments:
                values: [rule]

  - name: fct_client_margin
    description: >
      Client × UTC month: what Fernway billed and should have billed (M09 revenue leakage), the provider costs of
      the client's events (A09, A32) and the margin (M10). Revenue and costs cover the same events, the ledger
      export: provider lines after the ledger watermark belong to the next billing cycle and are shown as pending.
    columns:
      - name: client_margin_id
        description: "`<client_id>:<YYYY-MM>`."
        data_tests: [unique, not_null]
      - name: client_id
        description: "{{ doc('client_id') }}"
        data_tests: [not_null]
      - name: month
        description: First day of the UTC month.
        data_tests: [not_null]
      - name: volume_minor
        description: Processed volume (succeeded card payments in the ledger), minor units.
      - name: billed_minor
        description: Actual client billing, the sum of the client's invoice lines (net of discounts), minor units.
        data_tests: [not_null]
      - name: expected_minor
        description: What the pricing agreement says Fernway should have billed, minor units.
        data_tests: [not_null]
      - name: revenue_leakage_minor
        description: M09 revenue leakage, expected − billed (positive = billed too little).
        data_tests: [not_null]
      - name: event_provider_fees_minor
        description: Invoiced provider fees of the client's events (and of lines the provider reported for the client without a ledger event).
      - name: volume_share_provider_fees_minor
        description: The client's volume share of monthly provider charges without an event (minimums, volume adjustments).
      - name: provider_fees_minor
        description: Event plus volume-share provider fees, net of credits, excluding pending lines.
        data_tests: [not_null]
      - name: fx_spread_cost_minor
        description: M08 FX spread cost of the client's converted payouts.
        data_tests: [not_null]
      - name: provider_cost_minor
        description: Provider fees + FX spread cost.
        data_tests: [not_null]
      - name: margin_minor
        description: M10 client margin, billed − provider fees − FX spread cost.
        data_tests: [not_null]
      - name: margin_bps
        description: M10 ÷ processed volume in basis points (null without volume).
      - name: pending_provider_fees_minor
        description: Provider fees on lines after the ledger watermark, billed to the client in the next cycle (A12) and kept out of this margin.
      - name: currency
        description: "{{ doc('currency') }}"
